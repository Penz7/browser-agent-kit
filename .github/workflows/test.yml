name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # jsdom (dev dependency for the DOM unit tests) needs Node 20+; the server and CLI support Node 18.
      - run: npm test
        if: matrix.node != 18
      - run: node server/test/native.test.mjs && node server/test/smoke.mjs
        if: matrix.node == 18
      - run: node bin/cli.js pack
      - run: node bin/cli.js native --extension-id abcdefghijklmnopabcdefghijklmnop
      - run: node bin/cli.js native --remove
